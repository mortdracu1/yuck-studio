<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YUCK — Projects</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Mono:wght@400;700&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #0a0a0a;
      --white: #f0ece0;
      --acid: #c8f000;
      --dim: rgba(240, 236, 224, 0.3);
      --line: rgba(240, 236, 224, 0.08);
    }

    html, body {
      background: var(--black);
      color: var(--white);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100%;
    }

    /* custom cursor */
    .cursor {
      position: fixed;
      width: 10px; height: 10px;
      background: var(--acid);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }

    /* SCANLINE */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.06) 3px,
        rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--black);
      border-bottom: 1px solid var(--line);
      padding: 1.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.25em;
      color: var(--white);
      text-decoration: none;
    }

    .logo span {
      color: var(--acid);
    }

    header nav {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* PAGE TITLE */
    .page-header {
      padding: 5rem 3rem 3rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .page-title {
      font-family: 'Space Mono', monospace;
      font-size: clamp(28px, 5vw, 64px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .page-count {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--dim);
      padding-bottom: 0.5rem;
    }

    /* TABLE HEADER */
    .table-head {
      display: grid;
      grid-template-columns: 80px 1fr 160px 120px;
      padding: 1rem 3rem;
      border-bottom: 1px solid var(--line);
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--dim);
    }

    /* PROJECT ROWS */
    .projects {
      list-style: none;
    }

    .project-row {
      display: grid;
      grid-template-columns: 80px 1fr 160px 120px;
      padding: 1.6rem 3rem;
      border-bottom: 1px solid var(--line);
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
      color: var(--white);
    }

    .project-row:hover {
      background: rgba(200, 240, 0, 0.04);
    }

    .project-row:hover .project-num {
      color: var(--acid);
    }

    .project-row:hover .project-arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    .project-num {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.1em;
      transition: color 0.15s;
    }

    .project-name {
      font-family: 'Space Mono', monospace;
      font-size: clamp(13px, 1.5vw, 17px);
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .project-desc {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.05em;
    }

    .project-date {
      font-size: 10px;
      color: rgba(240,236,224,0.2);
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .project-arrow {
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
      color: var(--acid);
    }

    /* EMPTY STATE — shows when no projects yet */
    .empty {
      padding: 6rem 3rem;
      text-align: center;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* FOOTER */
    footer {
      padding: 3rem;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4rem;
    }

    footer span {
      font-size: 10px;
      color: rgba(240,236,224,0.15);
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>

  <header>
    <a href="index.html" class="logo">YUCK<span>.</span>STUDIO</a>
    <nav>all projects</nav>
  </header>

  <div class="page-header">
    <h1 class="page-title">Projects</h1>
    <span class="page-count" id="count">— 0 drops</span>
  </div>

  <div class="table-head">
    <span>No.</span>
    <span>Project</span>
    <span>Type</span>
    <span>Date</span>
  </div>

  <ul class="projects" id="projects">
    <!-- 
      TO ADD A PROJECT: copy and paste one of the rows below.
      Update the href to point to your drop folder,
      and update the number, name, type, and date.

    <li>
      <a class="project-row" href="drops/001-project-name/">
        <span class="project-num">001</span>
        <span class="project-name">Project Name</span>
        <span class="project-desc">Type / Category</span>
        <span class="project-date">Apr 3, 2026 <span class="project-arrow">→</span></span>
      </a>
    </li>
    -->
  </ul>

  <div class="empty" id="empty">
    incoming.
  </div>

  <footer>
    <span>YUCK © 2026</span>
    <span>yuck.studio</span>
  </footer>

  <script>
    // cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    // count projects and update header
    const rows = document.querySelectorAll('.project-row');
    const countEl = document.getElementById('count');
    const emptyEl = document.getElementById('empty');

    if (rows.length > 0) {
      countEl.textContent = `— ${rows.length} drop${rows.length !== 1 ? 's' : ''}`;
      emptyEl.style.display = 'none';
    }
  </script>
</body>
</html>
